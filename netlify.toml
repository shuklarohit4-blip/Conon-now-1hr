[build]
  command = "VITE_LOCAL_ADMIN=false pnpm --filter @workspace/conon build"
  publish = "artifacts/conon/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.6.1"
  VITE_LOCAL_ADMIN = "false"

# Strictly block public access to any Admin routes on production CDN
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302
  force = true

# SPA Fallback for Storefront, Orders, Driver, Vendor routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"

# Long-term immutable caching for static hashes and images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rentals/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Render Blueprint for the CONON API and its PostgreSQL database.
# Render's default plans are paid; select/confirm plans and pricing in the
# Render Dashboard before creating these resources.
services:
  - type: web
    name: conon-api-prod
    runtime: node
    region: singapore
    autoDeployTrigger: commit
    buildCommand: corepack enable && corepack prepare pnpm@11.23.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    initialDeployHook: pnpm --filter @workspace/db run push
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://conon.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: conon-postgres-prod
          property: connectionString

databases:
  - name: conon-postgres-prod
    databaseName: conon
    user: conon
    region: singapore
    postgresMajorVersion: "17"

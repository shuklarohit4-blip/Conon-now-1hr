# Render Blueprint for the CONON API. Create/configure the Atlas database separately.
# Render's default plans are paid; select/confirm plans and pricing in the
# Render Dashboard before creating these resources.
services:
  - type: web
    name: conon-api-prod
    runtime: node
    region: singapore
    autoDeployTrigger: commit
    buildCommand: corepack enable && corepack prepare pnpm@11.23.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://conon.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DATABASE
        value: conon
      - key: MONGODB_URI
        sync: false
